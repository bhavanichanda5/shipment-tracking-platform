spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/shiptrack_db
spring.datasource.username={/* Add your PostgreSQL username here */}
spring.datasource.password={/* Add your PostgreSQL password here */}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

# it enables, Hibernate prints SQL in a nicely formatted way....It makes SQL easier to read.
#spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect ;  Every database understands SQL a little differently. if mySQL, PostgreSQL, Oracle, SQL Server, etc. Hibernate needs to know which database you are using so that it can generate the appropriate SQL for that database. This is done by specifying the dialect in the configuration. In this case, we are using PostgreSQL, so we specify the PostgreSQL dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server        ; When Spring Boot starts ....Tomcat started on port(s): 8080....... then your application runs at   http://localhost:8080
server.port=8080

geoapify.api.key={/* Add your Geoapify API key here */}

# Proof of Delivery evidence storage
app.upload.dir=uploads
app.upload.base-url=http://localhost:8080

# Signature/photo uploads — raise the default 1MB limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB


google.client.id={/* Add your Google Client ID here */}

app.frontend.url=http://localhost:5173

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={/* Add your Gmail username here */}
spring.mail.password={/* Add your Gmail password here */}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS notifications (Twilio) — leave blank to disable the SMS channel;
# email + in-app notifications keep working either way.
twilio.account-sid={/* Add your Twilio Account SID here */}
twilio.auth-token={/* Add your Twilio Auth Token here */}
twilio.from-number={/* Add your Twilio phone number here */}

# Without this, Spring Boot's default error handler strips the "message"
# field from error responses, so thrown exceptions (e.g. "This reset link
# has expired") show up as blank/generic errors on the frontend instead of
# their actual text.
server.error.include-message=always
server.error.include-binding-errors=always